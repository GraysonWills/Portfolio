name: Senior Engineer Review

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate one review or compare the frozen evaluation corpus
        type: choice
        options: [review, evaluate]
        default: review
      model:
        description: Optional model override for an artifact-only canary review
        type: string
      base_sha:
        description: Optional base commit for a canary review
        type: string
      head_sha:
        description: Optional head commit for a canary review
        type: string

concurrency:
  group: senior-review-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '22.x'

jobs:
  reviewer-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify reviewer contracts
        run: node --test scripts/senior_review.test.mjs scripts/evaluate_senior_review.test.mjs

  review:
    needs: reviewer-tests
    if: inputs.mode != 'evaluate'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install + Build (redis-api-server)
        if: github.event_name != 'workflow_dispatch'
        working-directory: redis-api-server
        run: |
          npm ci
          # Syntax check all JS files (cheap correctness gate)
          find src -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Install + Build (portfolio-app)
        if: github.event_name != 'workflow_dispatch'
        working-directory: portfolio-app
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Install + Build (blog-authoring-gui)
        if: github.event_name != 'workflow_dispatch'
        working-directory: blog-authoring-gui
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Generate Review Report
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ inputs.model || vars.OPENAI_REVIEW_MODEL || secrets.OPENAI_REVIEW_MODEL || 'gpt-6-astra' }}
          OPENAI_REVIEW_REASONING_EFFORT: ${{ vars.OPENAI_REVIEW_REASONING_EFFORT }}
          OPENAI_REVIEW_MAX_TOKENS: ${{ vars.OPENAI_REVIEW_MAX_TOKENS }}
          OPENAI_REVIEW_TIMEOUT_MS: '120000'
          OPENAI_REVIEW_MAX_RETRIES: '1'
          REVIEW_REQUIRE_SUCCESS: ${{ github.event_name == 'workflow_dispatch' }}
          REVIEW_ARTIFACTS_DIR: artifacts
          REVIEW_MAX_DIFF_CHARS: '180000'
          REVIEW_BASE_SHA: ${{ inputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}
          REVIEW_HEAD_SHA: ${{ inputs.head_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
        run: |
          node scripts/senior_review.mjs
          {
            echo "## Senior Engineer Review"
            echo ""
            echo "Report generated at \`artifacts/senior-review-report.md\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # Include a readable excerpt (full report is in artifact)
          python - <<'PY'
          import pathlib
          p = pathlib.Path("artifacts/senior-review-report.md")
          text = p.read_text(encoding="utf-8")
          print(text[:12000])
          PY

      - name: Upload Review Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senior-review
          path: artifacts/
          retention-days: 14

      - name: Comment On PR (Update Existing)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('artifacts/senior-review-pr-comment.md', 'utf8');
            const marker = '<!-- senior-review -->';
            const issue_number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

  evaluate:
    needs: reviewer-tests
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'evaluate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Compare Astra and the previous default
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_ARTIFACTS_DIR: artifacts/evaluation
        run: node scripts/evaluate_senior_review.mjs
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senior-review-evaluation
          path: artifacts/evaluation/
          retention-days: 14
